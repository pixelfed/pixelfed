name: Build Tagged Release Image

# Fires when a GitHub Release is published (including pre-releases).
# Image tags produced (two per release):
#   - Pre-release (or tag has -rc):   <tag> (e.g. v0.14.5-rc) + roaming "rc"
#   - Release labelled "Latest":      <tag> (e.g. v0.14.5)    + roaming "stable"
# A non-latest, non-prerelease release (e.g. a backport) only gets <tag>,
# so "stable" never moves backwards.
on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    # Keep the old "v*" tag guard. Skipping this job also skips build and merge.
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag_name: ${{ steps.channel.outputs.tag_name }}
      channel_tag: ${{ steps.channel.outputs.channel_tag }}
    steps:
      - name: Work out channel tag from release label
        id: channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          REPO: ${{ github.repository }}
        run: |
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          CHANNEL=""
          if [ "$IS_PRERELEASE" = "true" ] || [[ "$TAG_NAME" == *-rc* ]]; then
            # Pre-release label OR an -rc suffix: never allow it to become "stable".
            CHANNEL="rc"
          else
            # The "latest release" endpoint excludes drafts and pre-releases.
            # It can lag a few seconds behind publishing, so retry briefly.
            LATEST=""
            for attempt in 1 2 3 4 5; do
              LATEST=$(gh api "repos/${REPO}/releases/latest" --jq .tag_name 2>/dev/null || echo "")
              [ "$LATEST" = "$TAG_NAME" ] && break
              sleep 5
            done
            if [ "$LATEST" = "$TAG_NAME" ]; then
              CHANNEL="stable"
            fi
          fi

          echo "channel_tag=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "Tag: ${TAG_NAME} | prerelease=${IS_PRERELEASE} | channel tag: ${CHANNEL:-<none>}"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-26.04
          - platform: linux/arm64
            runs-on: ubuntu-26.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    steps:
      - name: Checkout tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare platform tag
        id: platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build and push (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=release-${{ steps.platform.outputs.pair }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ steps.platform.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tags list
        id: tags
        env:
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          CHANNEL_TAG: ${{ needs.prepare.outputs.channel_tag }}
        run: |
          # One tag per line.
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${TAG_NAME}"
            if [ -n "$CHANNEL_TAG" ]; then
              echo "${IMAGE_NAME}:${CHANNEL_TAG}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          tag_args=()
          while read -r t; do
            [ -n "$t" ] && tag_args+=(-t "$t")
          done <<< "$TAGS"

          digest_args=()
          for d in *; do
            digest_args+=("${IMAGE_NAME}@sha256:${d}")
          done

          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"

      - name: Inspect image
        env:
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          docker buildx imagetools inspect "${IMAGE_NAME}:${TAG_NAME}"

      - name: Summary
        env:
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          CHANNEL_TAG: ${{ needs.prepare.outputs.channel_tag }}
        run: |
          {
            echo "### Release image build"
            echo "- Release tag: \`${TAG_NAME}\`"
            echo "- Channel tag: \`${CHANNEL_TAG:-none}\`"
            echo "- Platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
