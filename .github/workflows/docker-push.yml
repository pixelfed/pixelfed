name: Build Branch Image

# Fires on push to either branch, but each branch only ever produces its own
# tag — a push to staging never touches the 'latest'/dev image and vice versa.
on:
  push:
    branches:
      - dev
      - staging

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine branch tag
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "branch_tag=latest" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "branch_tag=staging" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected branch: ${{ github.ref_name }}" >&2
            exit 1
          fi
          echo "short_sha=$(echo ${GITHUB_SHA} | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Branch tag (latest/staging) plus an immutable sha tag for that
          # same branch, so you can always pin/rollback to an exact build
          # even after 'latest' or 'staging' has moved on.
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.branch_tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.branch_tag }}-${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
