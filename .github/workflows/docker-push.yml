name: Build Branch Image

# Every push to dev builds an image with two tags:
#   - dev-<short commit sha>   static, never moves
#   - dev                      roaming, always the newest dev build
on:
  push:
    branches:
      - dev

# One run per commit, and never cancel a running build. This guarantees every
# commit gets its own static dev-<sha> tag. The roaming "dev" tag is protected
# from moving backwards by the head check in the merge job.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-26.04
          - platform: linux/arm64
            runs-on: ubuntu-26.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare platform tag
        id: platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build and push (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ github.ref_name }}-${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-${{ steps.platform.outputs.pair }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ steps.platform.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds can finish out of order (a slow older commit can finish after a
      # newer one). Only move the roaming "dev" tag if this commit is still the
      # tip of the branch.
      - name: Check this commit is still the head of the branch
        id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          HEAD_SHA=$(gh api "repos/${REPO}/git/ref/heads/${BRANCH}" --jq .object.sha 2>/dev/null || echo "$SHA")
          if [ "$HEAD_SHA" = "$SHA" ]; then
            echo "is_head=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_head=false" >> "$GITHUB_OUTPUT"
          fi
          echo "This commit: ${SHA} | Branch head: ${HEAD_SHA}"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev,enable=${{ steps.head.outputs.is_head == 'true' }}
            type=sha,format=short,prefix=dev-

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          tag_args=()
          while read -r t; do
            [ -n "$t" ] && tag_args+=(-t "$t")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

          digest_args=()
          for d in *; do
            digest_args+=("${IMAGE_NAME}@sha256:${d}")
          done

          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"

      - name: Inspect image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}"
